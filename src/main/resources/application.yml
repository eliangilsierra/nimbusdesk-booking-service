server:
  port: 8082

spring:
  application:
    name: nimbusdesk-booking-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nimbusdesk}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:nimbusdesk_dev}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
